# Konfigurasi Nginx Reverse Proxy untuk Sistem Manajemen Inventori Gudang (Kelompok 3)
# Dipasang langsung di host Ubuntu (bukan container) agar log akses tetap tertulis di
# /var/log/nginx/access.log yang dibaca oleh /opt/scripts/analyze_log.sh (Fase 6).
# File ini juga menjadi sumber tunggal (single source of truth) untuk Ansible Fase 5.

server {
    listen 80;
    server_name _;

    # Sembunyikan nomor versi Nginx di header Server dan halaman error
    # untuk mengurangi kebocoran informasi (information disclosure).
    server_tokens off;

    # Log akses standar (format combined) wajib di /var/log/nginx/access.log
    # agar skrip analisis log (Fase 6) dapat mengekstrak 5 IP pengakses terbanyak.
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # Header keamanan dasar untuk melindungi klien di browser
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        # Teruskan permintaan publik port 80 ke aplikasi Docker di loopback host 127.0.0.1:8000
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Header reverse proxy standar agar aplikasi (ProxyFix) mengetahui
        # host asli, IP klien asli, dan protokol asal permintaan.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
