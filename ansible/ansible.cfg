# Konfigurasi Ansible untuk Proyek UAS ASBOS Kelompok 3 (Fase 5)
# Menyederhanakan perintah ansible-playbook agar otomatis membaca inventory.ini
# dan tetap menegakkan keamanan verifikasi host key SSH.

[defaults]
inventory = ./inventory.ini
# Tetap aktifkan pemeriksaan host key SSH untuk mencegah serangan MITM
host_key_checking = True
# Nonaktifkan pembuatan file .retry agar direktori kerja tetap bersih
retry_files_enabled = False
# Deteksi otomatis interpreter Python 3 pada Ubuntu 24.04 Managed Node
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
